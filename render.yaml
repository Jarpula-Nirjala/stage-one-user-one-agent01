services:
  - type: web
    name: one-user-one-agent
    runtime: python
    plan: free
    buildCommand: "echo 'no dependencies: standard library only'"
    startCommand: "PYTHONPATH=src python -m stage_agent.web"
    healthCheckPath: /healthz
    envVars:
      - key: PYTHON_VERSION
        value: "3.11.9"
      - key: QUIET
        value: "1"
      - key: APP_USERNAME
        value: jarpula
      - key: APP_PASSWORD        # Render generates a random value: read it in the service's Environment tab
        generateValue: true
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOW_GUEST
        value: "1"
